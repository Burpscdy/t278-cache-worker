name: Deploy T278 Cloudflare Canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify required deployment secrets exist
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          T278_CANARY_TOKEN: ${{ secrets.T278_CANARY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$T278_CANARY_TOKEN"

      - name: Build one-use Worker secrets file
        shell: bash
        env:
          T278_CANARY_TOKEN: ${{ secrets.T278_CANARY_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          with open("cloudflare/.t278-secrets.json", "w", encoding="utf-8") as f:
              json.dump({"T278_CANARY_TOKEN": os.environ["T278_CANARY_TOKEN"]}, f)
          PY
          chmod 600 cloudflare/.t278-secrets.json

      - name: Deploy isolated Worker and dedicated secret
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy --secrets-file .t278-secrets.json

      - name: Remove temporary secrets file
        if: always()
        shell: bash
        run: rm -f cloudflare/.t278-secrets.json
