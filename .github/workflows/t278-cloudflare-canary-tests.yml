name: T278 Cloudflare Canary Tests

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/t278-cloudflare-canary-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run contract tests
        run: node --test cloudflare/src/worker.test.mjs
