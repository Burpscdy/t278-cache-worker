name: T278 Dukascopy Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/t278-dukascopy-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-one-blocked-day:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch AUD USD 2021-12-29 cache shard
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/t278-cycle6-seed/aud_usd"
          mkdir -p "$ROOT/minute" "$ROOT/ticks"

          fetch_json() {
            url="$1"
            out="$2"
            tmp="${out}.tmp"
            code="$(curl --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 45 --output "$tmp" --write-out '%{http_code}' "$url")"
            bytes="$(wc -c < "$tmp" | tr -d ' ')"
            echo "$code $bytes $url"
            test "$code" = "200"
            test "$bytes" -gt 100
            python3 -c 'import json,sys; p=json.load(open(sys.argv[1],"rb")); m=sorted({"timestamp","multiplier"}-p.keys()); (_ for _ in ()).throw(SystemExit(f"missing required Jetta fields: {m}")) if m else None' "$tmp"
            mv "$tmp" "$out"
            sleep 2
          }

          fetch_json "https://jetta.dukascopy.com/v1/candles/minute/AUD-USD/BID/2021/12/29" "$ROOT/minute/2021-12-29-BID.json"
          fetch_json "https://jetta.dukascopy.com/v1/candles/minute/AUD-USD/ASK/2021/12/29" "$ROOT/minute/2021-12-29-ASK.json"

          for hour in $(seq 13 22); do
            fetch_json "https://jetta.dukascopy.com/v1/ticks/AUD-USD/2021/12/29/$hour" "$ROOT/ticks/2021-12-29-$hour.json"
          done

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "t278-cycle6-seed"
          files = sorted(p for p in root.rglob("*.json"))
          if len(files) != 12:
              raise SystemExit(f"expected 12 JSON payloads, found {len(files)}")

          manifest = []
          for path in files:
              raw = path.read_bytes()
              json.loads(raw)
              manifest.append({
                  "path": str(path.relative_to(root)),
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })

          receipt = {
              "status": "PASS",
              "instrument": "AUD_USD",
              "day": "2021-12-29",
              "payload_count": len(files),
              "total_bytes": sum(item["bytes"] for item in manifest),
              "payloads": manifest,
              "broker_action": "NONE",
              "live_capital": False,
          }
          (root / "manifest.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload cache shard
        uses: actions/upload-artifact@v4
        with:
          name: t278-audusd-2021-12-29-cache-shard
          path: ${{ runner.temp }}/t278-cycle6-seed
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
